name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dependencies
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
      - run: ruff check qfp tests scripts
      - name: Verify frozen sample checksums
        run: python scripts/data_manifest.py verify --data-dir data/sample
      # includes tests/test_sample_regression.py: the full pipeline on the frozen
      # sample must reproduce tests/expected/ exactly (to rounding)
      - run: pytest -q
      - name: Mini study report on the frozen sample
        run: python -m qfp.pipeline --config configs/sample.yaml
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: sample-report
          path: reports_sample/
