[project]
name = "qfp"
version = "0.1.0"
description = "Reproducible cross-sectional factor research pipeline: IC/ICIR, IC decay, quantile backtests"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pyarrow>=12",
  "pyyaml>=6",
]

[project.optional-dependencies]
data = ["akshare>=1.12", "baostock>=0.8.8"]
dev = ["pytest>=7", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["qfp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"qfp/report.py" = ["E501"]  # markdown table templates
